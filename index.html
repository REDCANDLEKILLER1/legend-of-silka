<style>

// ============ engine ============
let scene = null, player = null, mode = 'card', tick = 0;
function tileAt(s, x, y){ if (x < 0 || y < 0 || y >= s.rows.length || x >= s.rows[0].length) return '#'; return s.rows[y][x]; }
function walkable(s, x, y, self){
  if (SOLID[s.set].has(tileAt(s, x, y))) return false;
  for (const e of s.entities) if (e !== self && !e.hidden && e.x === x && e.y === y) return false;
  return true;
}
function makeEnt(spr, x, y, opts = {}){
  return Object.assign({ spr, x, y, px: x * TILE, py: y * TILE, dir: 'down', moveT: 0,
    fromX: x, fromY: y, hidden: false, name: '', talk: null }, opts);
}

  const nx = e.x + d[0], ny = e.y + d[1];

function updateEnt(e, dt){

    e.py = (e.fromY + (e.y - e.fromY) * t) * TILE;
    if (t >= 1) e.moveT = 0;

function pathTo(e, tx, ty){
  const key = (x, y) => x + ',' + y;

  const q = [[e.x, e.y]];
  while (q.length){
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [d, dx, dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]]){
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (prev.has(k)) continue;
      if (SOLID[scene.set].has(tileAt(scene, nx, ny))) continue;
      if (!(nx === tx && ny === ty)){
        let blocked = false;
        for (const o of scene.entities) if (o !== e && !o.hidden && o.x === nx && o.y === ny) blocked = true;
        if (blocked) continue;
      }
      prev.set(k, [key(x, y), d]); q.push([nx, ny]);
    }
  }
  if (!prev.has(key(tx, ty))) return [];

let camX = 0, camY = 0;
function updateCam(){
  const mw = scene.rows[0].length * TILE, mh = scene.rows.length * TILE;
  const vw = VIEW_W * TILE, vh = VIEW_H * TILE;
  const f = player || scene.focus || null;
  let tx = (mw - vw) / 2, ty = (mh - vh) / 2;
  if (f){ tx = f.px + TILE / 2 - vw / 2; ty = f.py + TILE / 2 - vh / 2; }
  camX = mw <= vw ? (mw - vw) / 2 : Math.max(0, Math.min(mw - vw, tx));
  camY = mh <= vh ? (mh - vh) / 2 : Math.max(0, Math.min(mh - vh, ty));
}
function render(){
  tick++;

  if (!scene) return;
  updateCam();
  ctx.save();
  ctx.scale(SCALE, SCALE);
  ctx.translate(-Math.round(camX), -Math.round(camY));
  const x0 = Math.max(0, Math.floor(camX / TILE)), x1 = Math.min(scene.rows[0].length - 1, Math.ceil((camX + VIEW_W * TILE) / TILE));
  const y0 = Math.max(0, Math.floor(camY / TILE)), y1 = Math.min(scene.rows.length - 1, Math.ceil((camY + VIEW_H * TILE) / TILE));
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++){
      const t = TILES[scene.set][scene.rows[y][x]];
      if (t) ctx.drawImage(t, x * TILE, y * TILE);
    }
  const es = [...scene.entities].filter(e => !e.hidden).sort((a, b) => a.py - b.py);
  for (const e of es){
    const img = typeof e.spr === 'function' ? e.spr(tick) : e.spr;
    const dx = e.px, dy = e.py + TILE - img.height;
    if (e.aura){
      const p = .5 + .5 * Math.sin(tick * .09);
      const gx = dx + img.width / 2, gy = dy + img.height / 2;
      const gr = ctx.createRadialGradient(gx, gy, 2, gx, gy, 26 + p * 8);
      gr.addColorStop(0, `rgba(233,213,255,${.30 + p * .18})`);
      gr.addColorStop(.5, `rgba(147,51,234,${.26 + p * .14})`);
      gr.addColorStop(1, 'rgba(88,28,135,0)');
      ctx.save(); ctx.globalCompositeOperation = 'lighter';

    ctx.drawImage(img, dx, dy);

}

function drawTitleSet(set){ for (const [x, y, w, h, p] of set){ ctx.fillStyle = TITLE_PAL[p]; ctx.fillRect(x * 4, y * 4, w * 4, h * 4); } }

let lastT = 0;

  mode = 'script'; objective('');
  await fadeTo(1, 700);
  playM(MUS.jingle);
  await card({ art: true, title: 'PART ONE', sub: 'THE LEGEND OF SILKA — PART ONE COMPLETE',
    lines: ['The road south leads to the first field.', 'The road north leads under the mountain.'] });
  location.reload();
}

// ============ acts / boot ============
async function act1(){
  G.stage = 0; G.cup = false;
  loadScene(buildHall());
  await fadeTo(0, 800);
  await say([['', 'The King\u2019s castle, the night of the harvest feast — a hundred years gone.'],
    ['', 'You are Pearl, nine years old, small enough to be forgotten in a room full of grown-ups. Remember everything.']]);
  objective('Speak with Princess Silka');
  mode = 'play';
}
async function act2(){
  loadScene(buildVillage());
  await fadeTo(0, 800);
  await say([['', 'The Castle-Foot Village, a hundred harvests later. The fields are gold. The statue\u2019s flowers are fresh.'],
    ['', 'An old woman under the cliff has been expecting — no. She has always been expecting.']]);
  objective('Find old Pearl\u2019s cottage — northwest, under the cliff');
  mode = 'play';
}
async function act3(){
  loadScene(buildCottage());
  await fadeTo(0, 700);
  mode = 'play';
  objective('Speak with old Pearl');
}
(async function boot(){
  const H = location.hash; // scene-preview hooks (used for screenshot checks)
  if (H === '#hall' || H === '#village' || H === '#cottage'){
    $('card').style.display = 'none';
    loadScene(H === '#hall' ? buildHall() : H === '#village' ? buildVillage() : buildCottage());
    if (H === '#village') scene.entities.push(makeEnt(wizSpr, 24, 16, { aura: true }));
    $('fade').style.opacity = 0; mode = 'play'; return;
  }
  const c = $('card');
  c.className = 'layer art';
  c.style.backgroundImage = 'none';
  const GEMS = [[50.3, 5.3, 6], [50.3, 31.7, 9.5], [40.6, 31.7, 4.5], [59.4, 31.7, 4.5],
                [50.2, 45.2, 6], [30.6, 89.6, 4], [69.4, 89.6, 4]];
  const STARS = [[6, 6], [12, 3.5], [88, 5], [94, 9], [80, 2.5], [20, 9], [3, 14], [97, 16]];
  c.innerHTML = '<div class="bgimg"></div>' +
    GEMS.map((g, i) => '<div class="gem" style="left:' + g[0] + '%;top:' + g[1] + '%;width:' + g[2] +
      '%;aspect-ratio:1;animation-delay:' + (i * 0.37).toFixed(2) + 's"></div>').join('') +
    '<div class="pushglow"></div>' +
    STARS.map((s, i) => '<div class="star" style="left:' + s[0] + '%;top:' + s[1] +
      '%;animation-delay:' + (i * 0.53).toFixed(2) + 's"></div>').join('');
  c.style.display = 'flex';
  const bgEl = c.querySelector('.bgimg');
  const FR = ['art/title-frames/f0.jpg', 'art/title-frames/f1.jpg',
              'art/title-frames/f2.jpg', 'art/title-frames/f3.jpg'];
  if (typeof Image !== 'undefined') FR.forEach(u => { const im = new Image(); im.src = u; });
  let fi = 0;
  bgEl.style.backgroundImage = 'url(' + FR[0] + ')';
  const cycle = setInterval(() => { fi = (fi + 1) % 4; bgEl.style.backgroundImage = 'url(' + FR[fi] + ')'; }, 190);
  let woke = false;
  const tapA = () => { aPressed = true; };
  const wake = () => { if (!woke){ woke = true; playM(MUS.theme); } };
  addEventListener('pointerdown', wake); addEventListener('keydown', wake);
  addEventListener('pointerdown', tapA);
  await new Promise(r => { const iv = setInterval(() => { if (woke){ clearInterval(iv); r(); } }, 60); });
  takeA(); // flush the waking tap — the NEXT tap / A press is PUSH START
  await new Promise(r => { const iv = setInterval(() => { if (takeA()){ clearInterval(iv); r(); } }, 60); });
  removeEventListener('pointerdown', wake); removeEventListener('keydown', wake);
  removeEventListener('pointerdown', tapA);
  clearInterval(cycle);
  c.style.display = 'none';
  stopM(MUS.theme); playM(MUS.fanfare);
  await fadeTo(1, 400); await act1();
})();
</script>
