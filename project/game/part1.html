<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Legend of Silka — Adventure of CornMan — Part One</title>
<style>
  html, body { margin:0; padding:0; background:#0b0910; height:100%; overflow:hidden;
    font-family:'Courier New', monospace; -webkit-user-select:none; user-select:none; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    --gw:min(100vw, 133.33vh); }
  #stage { position:relative; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; background:#16210f; display:block;
    width:var(--gw); height:auto; aspect-ratio:4/3; }
  .layer { position:absolute; inset:0; }
  #card { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:#000; color:#e8dfc8; z-index:30; padding:4%; box-sizing:border-box; }
  #card.art { background-size:cover; background-position:center; }
  #card h1 { font-size:clamp(22px, 6vw, 54px); letter-spacing:.35em; margin:.2em 0; color:#f3e9c9;
    text-shadow:0 0 18px rgba(147,51,234,.75), 0 2px 0 #000; }
  #card h2 { font-size:clamp(12px, 2.6vw, 20px); letter-spacing:.25em; color:#cdbf9d; font-weight:normal; margin:.2em 0 1em; }
  #card p { font-size:clamp(13px, 2.8vw, 19px); line-height:1.7; max-width:34em; color:#e8dfc8; text-shadow:0 1px 2px #000; }
  #card .go { margin-top:1.4em; font-size:clamp(13px, 3vw, 18px); color:#ffd91a; animation:blink 1.2s steps(2) infinite; }
  #card .bgimg { position:absolute; inset:0; background-size:cover; background-position:center;
    animation:kenburns 26s ease-in-out infinite alternate; }
  @keyframes kenburns { from { transform:scale(1); } to { transform:scale(1.07); } }
  #card .pushstart { position:absolute; left:0; right:0; bottom:7.5%; z-index:2; text-align:center;
    font-family:Georgia, 'Times New Roman', serif; font-weight:bold; letter-spacing:.4em; text-indent:.4em;
    font-size:clamp(15px, 3.4vw, 24px); color:#fff8e8; text-shadow:0 2px 0 #000, 0 0 14px rgba(0,0,0,.85);
    animation:blink 1.3s steps(2) infinite; }
  #card .gem { position:absolute; border-radius:50%; pointer-events:none; z-index:2;
    background:radial-gradient(circle, rgba(130,255,180,.9) 0%, rgba(30,230,120,.35) 42%, rgba(0,255,120,0) 70%);
    mix-blend-mode:screen; transform:translate(-50%,-50%); animation:gemPulse 2.8s ease-in-out infinite; }
  @keyframes gemPulse { 0%,100% { opacity:.45; transform:translate(-50%,-50%) scale(1); }
    50% { opacity:1; transform:translate(-50%,-50%) scale(1.3); } }
  #card .pushglow { position:absolute; left:50%; top:89.5%; width:47%; height:10.5%; z-index:2; pointer-events:none;
    transform:translate(-50%,-50%); border-radius:12px;
    background:radial-gradient(ellipse, rgba(255,240,190,.55), rgba(255,240,190,0) 70%);
    mix-blend-mode:screen; animation:pushPulse 1.5s ease-in-out infinite; }
  @keyframes pushPulse { 0%,100% { opacity:.25; } 50% { opacity:.8; } }
  #card .star { position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; z-index:2;
    pointer-events:none; box-shadow:0 0 6px 2px rgba(255,255,255,.75); animation:starTw 2.4s ease-in-out infinite; }
  @keyframes starTw { 0%,100% { opacity:.15; } 50% { opacity:1; } }
  @keyframes blink { 50% { opacity:0; } }
  #objective { position:absolute; top:0; left:0; z-index:20; color:#ffe9a8; background:rgba(10,8,4,.72);
    padding:.45em .8em; font-size:clamp(11px, 2.4vw, 15px); letter-spacing:.06em; border-bottom:2px solid #8c6214; display:none; }
  #objective b { color:#fff; }
  #dlg { position:absolute; left:3%; right:3%; bottom:3%; z-index:25; background:rgba(12,10,18,.94);
    border:3px solid #c9b98a; outline:2px solid #181010; color:#f3ecd9; padding:.7em .9em .9em; display:none;
    min-height:4.6em; box-sizing:border-box; cursor:pointer; }
  #dlg .who { color:#ffd91a; font-size:clamp(11px, 2.4vw, 14px); letter-spacing:.15em; margin-bottom:.35em; }
  #dlg .txt { font-size:clamp(13px, 3vw, 18px); line-height:1.55; white-space:pre-wrap; }
  #dlg .next { position:absolute; right:.7em; bottom:.4em; color:#ffd91a; animation:blink 1s steps(2) infinite; font-size:14px; }
  #fade { background:#000; opacity:0; pointer-events:none; transition:opacity .6s linear; z-index:28; }
  #flash { background:#e9d5ff; opacity:0; pointer-events:none; z-index:27; }
  #touch { display:none; width:var(--gw); box-sizing:border-box; justify-content:space-between; align-items:center;
    padding:10px 2% 14px; }
  #touch .pad { display:grid; grid-template-columns:repeat(3, 54px); grid-template-rows:repeat(3, 54px); }
  #touch button { background:rgba(20,16,28,.85); border:2px solid rgba(201,185,138,.7); color:#f3e9c9;
    font-size:20px; border-radius:10px; touch-action:none; }
  #touch .btns { display:flex; gap:14px; align-items:flex-end; }
  #touch .abtn { width:68px; height:68px; border-radius:50%; font-size:23px; }
  #touch .bbtn { width:56px; height:56px; border-radius:50%; font-size:20px; margin-bottom:16px; }
  @media (pointer:coarse) { #wrap { --gw:min(100vw, calc((100dvh - 150px) * 1.3333)); } #touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="512" height="384"></canvas>
  <div id="objective"></div>
  <div id="dlg"><div class="who"></div><div class="txt"></div><div class="next">▼</div></div>
  <div id="flash" class="layer"></div>
  <div id="fade" class="layer"></div>
  <div id="card" class="layer art"></div>
</div>
<div id="touch">
  <div class="pad">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><span></span><button data-d="right">▶</button>
    <span></span><button data-d="down">▼</button><span></span>
  </div>
  <div class="btns"><button class="bbtn" id="bbtn">B</button><button class="abtn" id="abtn">A</button></div>
</div>
</div>

<script src="sprites-data.js"></script>
<script src="title-scene.js"></script>
<script>
'use strict';
// ============ helpers / audio ============
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const TILE = 16, VW = 32, VH = 24;
// Zelda 1 proportions (Michael, 2026-11-20): the screen shows 16x12 tiles at 2x,
// never the whole map at once — the hero stands one tile wide, like Link.
const SCALE = 2, VIEW_W = 16, VIEW_H = 12;
const wait = ms => new Promise(r => setTimeout(r, ms));
const MUS = { theme: new Audio('../music/main-theme.mp3'),
              chime: new Audio('../music/secret-discovered.mp3'),
              jingle: new Audio('../music/jingle-16bit.mp3'),
              fanfare: new Audio('../music/fanfare-opera.mp3') };
MUS.theme.loop = true; MUS.theme.volume = .8;
function playM(a){ try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){} }
function stopM(a){ try{ a.pause(); }catch(e){} }

// ============ sprite baking ============
function bake(rows, pal){
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const col = pal[rows[y][x]];
    if (col){ g.fillStyle = col; g.fillRect(x, y, 1, 1); }
  }
  return c;
}
const SPR = {};
function bakeSet(name, pal){
  const set = {};
  for (const d of ['down','up','left','right']){
    if (!SPRITES[name + '_' + d]) continue;
    const e = { i: bake(SPRITES[name + '_' + d], pal) };
    if (SPRITES[name + '_' + d + '_w']) e.w = bake(SPRITES[name + '_' + d + '_w'], pal);
    set[d] = e;
  }
  return set;
}
for (const n of ['silka','pearlY','pearlO','eli','folkA','folkB','guard','cornman','cook','jester'])
  SPR[n] = bakeSet(n, PAL);
SPR.king = bakeSet('king', KING_PAL);
SPR.statue = bake(SPRITES.king_down, STATUE_PAL);
SPR.crowA = bake(SPRITES.crowA, PAL);
SPR.crowB = bake(SPRITES.crowB, PAL);
SPR.wizardA = bake(SPRITES.wizardA, WIZ_PAL);
SPR.wizardB = bake(SPRITES.wizardB, WIZ_PAL);
{ // CornMan punch sets: anticipation / extension / recover, per direction + arm
  const P = {};
  for (const k of ['down_r','down_l','right_r','up_r','left_r']){
    const a = SPRITES['cornman_pa_' + k], x = SPRITES['cornman_px_' + k], r = SPRITES['cornman_pr_' + k];
    if (a && x && r) P[k] = [bake(a, PAL), bake(x, PAL), bake(r, PAL)];
  }
  if (Object.keys(P).length) SPR.cornman.punch = P;
}

// ============ tile painters (one light, upper left) ============
function tile(fn){ const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const g = c.getContext('2d'); fn(g); return c; }
function R(g, x, y, w, h, col){ g.fillStyle = col; g.fillRect(x, y, w, h); }
// One tile of Pearl's 3-wide fireplace. pos: 0 left, 1 centre (kettle), 2 right.
// Flames are tapered tongues (wide bed, narrow tip, bright core) that dance per
// frame — never stacked bars.
function fireplaceTile(pos, f){
  return tile(g => {
    R(g,0,0,16,16,'#5b544b'); R(g,0,0,16,2,'#76726a'); R(g,0,2,16,1,'#453f38');
    R(g,1,3,14,13,'#241a12');
    R(g,2,13,12,2,'#3a2412'); R(g,3,14,10,1,'#241505');           // logs
    const emb = ['#e8641e','#c42838','#f5bd1f'];                   // ember bed, shifts per frame
    for (let i = 0; i < 5; i++) R(g, 3 + ((i * 3 + f * 2) % 10), 13, 1, 1, emb[(i + f) % 3]);
    const fc = pos === 0 ? 11 : pos === 2 ? 5 : 8;                 // tongue centre leans to the middle tile
    const H = (pos === 1 ? [10, 12, 11] : [6, 7, 6])[f];           // flame height dances
    const sway = [0, 1, 0][f];
    for (let y = 13; y >= 14 - H; y--){                            // outer tongue
      const hw = y >= 11 ? 3 : y >= 8 ? 2 : 1;
      R(g, fc - hw + (y < 9 ? sway : 0), y, hw * 2, 1, '#e8641e');
    }
    for (let y = 12; y >= 14 - Math.max(3, H - 3); y--){           // bright core
      const hw = y >= 10 ? 2 : 1;
      R(g, fc - hw, y, hw * 2, 1, y >= 10 ? '#f5bd1f' : '#fff066');
    }
    R(g, fc + (f === 1 ? -4 : 4), 10, 1, 3, '#e8641e');             // side lick
    if (pos === 1){ // the kettle, hanging over the fire
      R(g,7,2,2,2,'#181010'); R(g,5,4,6,4,'#1a1512'); R(g,6,5,2,1,'#3a352f'); R(g,5,8,6,1,'#0f0c0a');
    }
    if (pos === 0) R(g,14,3,2,13,'#453f38');
    if (pos === 2) R(g,0,3,2,13,'#453f38');
  });
}
const TILES = {
village: {
  '#': tile(g => { R(g,0,0,16,16,'#1d3312'); R(g,0,0,16,5,'#2c4d1a'); R(g,1,2,3,2,'#3c6624'); R(g,9,1,4,2,'#3c6624'); R(g,5,4,3,2,'#244016'); }),
  '^': tile(g => { R(g,0,0,16,16,'#6b5a49'); R(g,0,0,16,4,'#8a7660'); R(g,0,12,16,4,'#4e4033'); R(g,2,6,5,2,'#7d6a55'); R(g,10,8,4,2,'#594a3a'); }),
  'R': tile(g => { R(g,0,0,16,16,'#7a7268'); R(g,0,0,16,5,'#948b7f'); R(g,0,11,16,5,'#5b544b'); R(g,3,6,4,3,'#867d71'); R(g,10,5,3,4,'#665e54'); }),
  '=': tile(g => { R(g,0,0,16,16,'#9a917e'); R(g,0,0,16,2,'#b3a98f'); R(g,0,14,16,2,'#7d7462'); R(g,7,0,2,16,'#847a66'); R(g,0,7,16,2,'#847a66'); }),
  '+': tile(g => { R(g,0,0,16,16,'#a9834f'); R(g,0,0,16,3,'#bd985c'); R(g,0,13,16,3,'#8a6a3c'); R(g,3,6,3,2,'#97744a'); R(g,11,9,3,2,'#97744a'); }),
  'H': tile(g => { R(g,0,0,16,16,'#7e2f26'); R(g,0,0,16,4,'#9c4034'); R(g,0,4,16,2,'#6b271e'); R(g,0,9,16,2,'#6b271e'); R(g,0,14,16,2,'#5d211a'); R(g,2,1,3,2,'#b05244'); }),
  'W': tile(g => { R(g,0,0,16,16,'#e6d7b8'); R(g,0,0,2,16,'#4a2814'); R(g,14,0,2,16,'#4a2814'); R(g,0,7,16,2,'#4a2814'); R(g,6,10,4,5,'#7fb2d9'); R(g,6,10,4,1,'#cfe6f7'); R(g,0,15,16,1,'#b8a888'); }),
  'D': tile(g => { R(g,0,0,16,16,'#e6d7b8'); R(g,0,0,2,16,'#4a2814'); R(g,14,0,2,16,'#4a2814'); R(g,4,2,8,14,'#6b3a1e'); R(g,5,3,6,12,'#7d4a28'); R(g,10,8,1,2,'#f5bd1f'); R(g,4,2,8,1,'#8c5a30'); }),
  'T': tile(g => { R(g,0,0,16,16,'#3f7a2a'); R(g,1,1,9,7,'#4f9433'); R(g,6,5,9,8,'#356b21'); R(g,2,2,3,2,'#63aa42'); R(g,10,9,3,2,'#2c5c1c'); R(g,7,13,2,3,'#4a2814'); }),
  '.': tile(g => { R(g,0,0,16,16,'#4d8a2f'); R(g,0,0,16,3,'#5a9c38'); R(g,2,5,2,1,'#63aa42'); R(g,11,11,2,1,'#63aa42'); R(g,7,8,2,1,'#3f7425'); R(g,13,3,2,1,'#3f7425'); }),
  'f': tile(g => { R(g,0,0,16,16,'#4d8a2f'); R(g,0,0,16,3,'#5a9c38'); R(g,3,4,1,1,'#fff8e8'); R(g,11,6,1,1,'#f5bd1f'); R(g,6,11,1,1,'#e77fb0'); R(g,13,12,1,1,'#fff8e8'); R(g,8,3,1,1,'#e77fb0'); }),
  'F': [0,1].map(f => tile(g => { R(g,0,0,16,16,'#8f97a3'); R(g,2,2,12,12,'#6e7683'); R(g,4,4,8,8,'#5db9e8'); R(g,5,5,3,2,'#aee4fb'); R(g,7,2,2,3,'#cfd6de');
    if (f === 0){ R(g,7,1,2,2,'#eaf7ff'); R(g,10,9,2,1,'#aee4fb'); R(g,5,11,2,1,'#aee4fb'); }
    else { R(g,7,0,2,3,'#eaf7ff'); R(g,6,3,1,2,'#aee4fb'); R(g,9,10,2,1,'#aee4fb'); R(g,11,6,2,1,'#aee4fb'); } })),
  'S': tile(g => { R(g,0,0,16,16,'#4d8a2f'); R(g,3,11,10,4,'#8c897d'); R(g,4,12,8,2,'#a09c90'); R(g,5,10,6,1,'#76726a'); }),
  'P': tile(g => { R(g,0,0,16,16,'#4d8a2f'); R(g,0,0,16,3,'#5a9c38'); R(g,4,9,2,1,'#63aa42'); R(g,12,6,2,1,'#3f7425'); }),
  'N': tile(g => { R(g,0,0,16,16,'#4d8a2f'); R(g,0,0,16,3,'#5a9c38'); R(g,6,7,2,1,'#63aa42'); }),
  'c': tile(g => { R(g,0,0,16,16,'#8a6a3c'); R(g,1,0,2,16,'#28823e'); R(g,5,0,2,16,'#28823e'); R(g,9,0,2,16,'#28823e'); R(g,13,0,2,16,'#28823e'); R(g,1,3,2,3,'#f5bd1f'); R(g,9,8,2,3,'#f5bd1f'); R(g,5,12,2,3,'#e0aa00'); R(g,13,2,2,3,'#e0aa00'); }),
  'E': tile(g => { R(g,0,0,16,16,'#9a917e'); R(g,0,0,16,2,'#b3a98f'); R(g,0,14,16,2,'#7d7462'); R(g,2,7,12,2,'#847a66'); })
},
hall: {
  '#': tile(g => { R(g,0,0,16,16,'#4c4453'); R(g,0,0,16,3,'#655b6e'); R(g,0,13,16,3,'#372f3d'); R(g,7,0,2,16,'#3e3646'); R(g,0,7,16,1,'#3e3646'); }),
  'B': tile(g => { R(g,0,0,16,16,'#4c4453'); R(g,0,0,16,3,'#655b6e'); R(g,4,2,8,12,'#7e1f2b'); R(g,4,2,8,2,'#a32836'); R(g,7,5,2,5,'#f5bd1f'); R(g,4,13,8,1,'#5d141d'); }),
  'W': tile(g => { R(g,0,0,16,16,'#4c4453'); R(g,3,2,10,12,'#2c3550'); R(g,4,3,8,10,'#46587e'); R(g,5,4,3,4,'#6d84ad'); R(g,7,2,1,12,'#181010'); R(g,3,8,10,1,'#181010'); }),
  '+': tile(g => { R(g,0,0,16,16,'#8d8578'); R(g,0,0,16,2,'#a39a89'); R(g,0,14,16,2,'#6f675c'); R(g,7,0,1,16,'#776f62'); R(g,0,7,16,1,'#776f62'); }),
  'r': tile(g => { R(g,0,0,16,16,'#8e2432'); R(g,0,0,16,2,'#a92c3c'); R(g,0,14,16,2,'#6e1824'); R(g,1,1,1,14,'#f5bd1f'); R(g,14,1,1,14,'#f5bd1f'); }),
  'T': tile(g => { R(g,0,0,16,16,'#5d3a1e'); R(g,0,2,16,12,'#7d4a28'); R(g,0,2,16,2,'#9c622f'); R(g,3,5,4,3,'#e8e2d2'); R(g,10,9,4,3,'#e8e2d2'); R(g,4,6,2,1,'#f5bd1f'); R(g,11,10,2,1,'#c42838'); R(g,8,4,2,2,'#f5bd1f'); }),
  'C': [0,1].map(f => tile(g => { R(g,0,0,16,16,'#8d8578'); R(g,7,6,2,9,'#8c6214'); R(g,3,3,2,4,'#8c6214'); R(g,11,3,2,4,'#8c6214');
    if (f === 0){ R(g,3,1,2,2,'#ffd91a'); R(g,11,1,2,2,'#ffd91a'); R(g,7,2,2,3,'#ffd91a'); R(g,7,1,2,1,'#fff6c9'); }
    else { R(g,2,1,2,2,'#ffd91a'); R(g,12,0,2,2,'#ffd91a'); R(g,7,1,2,3,'#ffd91a'); R(g,8,0,1,1,'#fff6c9'); R(g,3,0,1,1,'#fff6c9'); } })),
  'H': tile(g => { R(g,0,0,16,16,'#6e1824'); R(g,2,3,12,13,'#8e2432'); R(g,2,3,12,3,'#f5bd1f'); R(g,4,8,8,6,'#a92c3c'); R(g,7,4,2,2,'#fff066'); }),
  'd': tile(g => { R(g,0,0,16,16,'#3e3646'); R(g,4,1,8,15,'#5d3a1e'); R(g,5,2,6,13,'#6f4525'); R(g,7,1,2,15,'#181010'); R(g,6,8,1,2,'#f5bd1f'); R(g,9,8,1,2,'#f5bd1f'); })
},
cottage: {
  '#': tile(g => { R(g,0,0,16,16,'#4a2f1a'); R(g,0,3,16,2,'#5d3a1e'); R(g,0,10,16,2,'#3a2412'); R(g,0,0,16,2,'#66452a'); }),
  'w': tile(g => { R(g,0,0,16,16,'#8a6136'); R(g,0,0,16,2,'#9c7444'); R(g,0,7,16,1,'#6f4a26'); R(g,0,15,16,1,'#6f4a26'); R(g,5,0,1,16,'#77522c'); R(g,11,0,1,16,'#77522c'); }),
  'F': [0,1,2].map(f => fireplaceTile(0, f)),
  'G': [0,1,2].map(f => fireplaceTile(1, f)),
  'J': [0,1,2].map(f => fireplaceTile(2, f)),
  'L': tile(g => { R(g,0,0,16,16,'#8a6136'); R(g,0,0,16,2,'#9c7444'); R(g,0,7,16,1,'#6f4a26'); R(g,0,15,16,1,'#6f4a26');
    R(g,2,9,6,5,'#5d3a1e'); R(g,3,10,4,3,'#9c7444'); R(g,4,11,2,1,'#5d3a1e');
    R(g,8,9,6,5,'#6f4525'); R(g,9,10,4,3,'#b0824f'); R(g,10,11,2,1,'#5d3a1e');

// ============ engine ============
let scene = null, player = null, mode = 'card', tick = 0;
function tileAt(s, x, y){ if (x < 0 || y < 0 || y >= s.rows.length || x >= s.rows[0].length) return '#'; return s.rows[y][x]; }
function walkable(s, x, y, self){
  if (SOLID[s.set].has(tileAt(s, x, y))) return false;
  for (const e of s.entities) if (e !== self && !e.hidden && e.x === x && e.y === y) return false;
  return true;
}
function makeEnt(spr, x, y, opts = {}){
  return Object.assign({ spr, x, y, px: x * TILE, py: y * TILE, dir: 'down', moveT: 0,
    fromX: x, fromY: y, hidden: false, name: '', talk: null,
    ambT: 0, rStep: 0, rWait: 0, punch: null, noShadow: false }, opts);
}
function stepEnt(e, dir){
  const d = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] }[dir];
  e.dir = dir;
  const nx = e.x + d[0], ny = e.y + d[1];
  if (!walkable(scene, nx, ny, e)) return false;
  e.fromX = e.x; e.fromY = e.y; e.x = nx; e.y = ny; e.moveT = 0.0001;
  return true;
}
function updateEnt(e, dt){
  if (e.punch){ e.punch.t += dt; if (e.punch.t >= 260) e.punch = null; }
  if (e.moveT > 0){
    e.moveT += dt / 130;
    const t = Math.min(1, e.moveT);
    e.px = (e.fromX + (e.x - e.fromX) * t) * TILE;
    e.py = (e.fromY + (e.y - e.fromY) * t) * TILE;
    if (t >= 1) e.moveT = 0;
  }
  if (e.path && e.path.length && e.moveT === 0){
    const dir = e.path[0];
    stepEnt(e, dir); e.path.shift();
  }
}
function pathTo(e, tx, ty){
  const key = (x, y) => x + ',' + y;
  const prev = new Map([[key(e.x, e.y), null]]);
  const q = [[e.x, e.y]];
  while (q.length){
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [d, dx, dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]]){
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (prev.has(k)) continue;
      if (SOLID[scene.set].has(tileAt(scene, nx, ny))) continue;
      if (!(nx === tx && ny === ty)){
        let blocked = false;
        for (const o of scene.entities) if (o !== e && !o.hidden && o.x === nx && o.y === ny) blocked = true;
        if (blocked) continue;
      }
      prev.set(k, [key(x, y), d]); q.push([nx, ny]);
    }
  }
  if (!prev.has(key(tx, ty))) return [];
  const dirs = []; let k = key(tx, ty);
  while (prev.get(k)){ dirs.unshift(prev.get(k)[1]); k = prev.get(k)[0]; }
  return dirs;
}
function moveEntTo(e, tx, ty){
  return new Promise(res => {
    e.path = pathTo(e, tx, ty);
    const iv = setInterval(() => { if ((!e.path || !e.path.length) && e.moveT === 0){ clearInterval(iv); res(); } }, 40);
  });
}
// Pick the sprite for an entity's current state: directional sets choose by
// facing + walk frame (+1px bob on the walk frame); a punch in flight wins;
// plain canvases and tick-functions (the Wizard) pass through.
function entImg(e){
  if (typeof e.spr === 'function') return { img: e.spr(tick), bob: 0 };
  const s = e.spr;
  if (s && s.down){
    if (e.punch && s.punch){
      const p = s.punch[e.dir + '_' + e.punch.arm] || s.punch['down_' + e.punch.arm];
      if (p) return { img: p[e.punch.t < 100 ? 0 : e.punch.t < 155 ? 1 : 2], bob: 0 };
    }
    const d = s[e.dir] || s.down;
    const moving = e.moveT > 0 || (e.path && e.path.length);
    if (moving && d.w){ const f = Math.floor(tick / 7) % 2; return { img: f ? d.w : d.i, bob: f }; }
    return { img: d.i, bob: 0 };
  }
  return { img: s, bob: 0 };
}

    if (nx >= A.roam[0] && ny >= A.roam[1] && nx <= A.roam[2] && ny <= A.roam[3]){ if (!stepEnt(e, d)) e.dir = d; }

  const vw = VIEW_W * TILE, vh = VIEW_H * TILE;

// grammar for triggers. Travel fades, swaps the scene, sets you down inside.
async function travel(buildFn, x, y, dir){
  mode = 'cutscene';
  await fadeTo(1, 320);
  loadScene(buildFn());
  player.x = x; player.y = y; player.px = x * TILE; player.py = y * TILE;
  player.fromX = x; player.fromY = y; player.moveT = 0; player.path = [];
  player.dir = dir;
  updateCam();
  await fadeTo(0, 320);
  mode = 'play';
}

        await say(cyc(jester, [
          ['JESTER', 'Why did the crow cross the valley? To tell the towers they blinked first. They hadn\u2019t. He\u2019s still embarrassed.'],
          ['JESTER', 'I told the King a joke about the black castle once. Once. The towers laughed. That\u2019s how I knew it was a bad joke.'],
          ['JESTER', 'A hundred years of peace, and my job is to be the loudest thing in the valley. I take it very seriously. That\u2019s the joke.']]));
      } } });
  const steward = makeEnt(SPR.folkB, 28, 8, { name: 'STEWARD', ambient: { pause: [2600, 5200] },
    talk: async () => say(cyc(steward, [
      ['STEWARD', 'The court keeps its hours, hero. Audience at the carpet\u2019s end, petitions after, dancing only from the jester.'],
      ['STEWARD', 'Everything in this castle has a place. Mine is two steps behind the King and one step ahead of trouble.']])) });
  const lady = makeEnt(SPR.silka, 27, 2, { name: 'LADY OF THE COURT', ambient: { pause: [2400, 5000] },
    talk: async () => say(cyc(lady, [
      ['LADY OF THE COURT', 'The court is glad of a guest who comes asking honest questions. There are so few.'],
      ['LADY OF THE COURT', 'The King is never far from the carpet\u2019s end. None of us are, on a day like this.']])) });
  const courtier = makeEnt(SPR.folkA, 20, 28, { name: 'COURTIER', ambient: { pause: [2200, 4600], roam: [18, 27, 23, 31] },
    talk: async () => say(cyc(courtier, [
      ['COURTIER', 'Word travels the great hall faster than the patrol walks it. A stranger, come to ask about the old story.'],
      ['COURTIER', 'Mind the jester, hero. He\u2019s been saving that dance. We\u2019ve all seen it twice this week already.']])) });
  const hero = makeEnt(SPR.cornman, 24, 33, {});
  hero.dir = 'up';
  return { set: 'castle', rows: out, player: hero,
    entities: [cook, patrol, mason, king, kingSide, throneGuardA, throneGuardB, jester, steward, lady, courtier],
    triggers: { '24,0': async () => travel(buildCastle2F, 23, 32, 'up'),
                '25,0': async () => travel(buildCastle2F, 23, 32, 'up'),
                '48,9': async () => travel(buildDungeon, 3, 2, 'down'),
                '24,34': async () => travel(buildVillage, 15, 3, 'down'),
                '25,34': async () => travel(buildVillage, 15, 3, 'down') },
    refs: {} };
}
function buildCottage(){
  const pearl = makeEnt(SPR.pearlO, 3, 3, { name: 'OLD PEARL', ambient: { pause: [1600, 3400] }, talk: async () => {
    if (!G.told){
      await say([['OLD PEARL', 'So the road brought you to my door first. It usually does. But this story does not start with an old woman, hero.'],
        ['OLD PEARL', 'It starts with a king. Go up and find him \u2014 the castle road climbs from the north overlook. Ask him what happened. Ask him plainly.'],
        ['OLD PEARL', 'Then come back to me, and I will give you the parts a crown cannot. Kings first. Then Pearl.']]);
      objective('Find the King \u2014 the castle road climbs from the north overlook');
    } else {
      await say(cyc(pearl, [
        ['OLD PEARL', 'Now you know it the way I know it. The cave, hero \u2014 the old cave under the mountain, the one the children are forbidden and the foxes use. Its mouth is in the fields south, where the ground first turns to stone.'],
        ['OLD PEARL', 'A hundred years I kept the story warm. It is yours now. When you are ready, the door is behind you \u2014 and the road is in front of you.']]));
      if (!G.ready){ G.ready = true; objective('Part One complete \u2014 leave by the cottage door when ready'); }
    } } });
  const hero = makeEnt(SPR.cornman, 7, 10, {});
  hero.dir = 'up';
  return { set: 'cottage', rows: COTTAGE, player: hero,
    entities: [pearl],
    triggers: { '7,11': async () => { if (G.told) await endPart(); else await travel(buildVillage, 5, 7, 'down'); },
                '8,11': async () => { if (G.told) await endPart(); else await travel(buildVillage, 5, 7, 'down'); } },
    refs: { pearl } };
}

// The spine of Part One (Michael's frame, 2026-11-20): CornMan walks in
// and finds the King. The meeting is a story beat, not a greeting. The
// King tells the first part himself; then the story plays out like a
// movie — preset scenes, talk bubbles, fades between places, people
// moving on their own — until CornMan is CornMan again and the adventure
// opens. The player only ever plays as CornMan.
async function theMovie(){
  if (G.told) return;
  G.told = true; mode = 'script'; objective('');
  await say([['THE KING', 'You have come a long road to stand on that carpet, hero. Men come to this throne for grain, for justice, for pardon. You have come for none of those.'],
    ['CORNMAN', 'Majesty \u2014 the village below keeps a statue of a king, and an old woman keeps fresh flowers on it. I came to ask what happened here.'],
    ['THE KING', 'Then hear it from the crown first. The statue is my great-grandfather. The face comes down the line with the crown \u2014 you are looking at both.'],
    ['THE KING', 'A hundred years ago he held a harvest feast in this castle, and something came to collect a debt the valley did not know it owed. I can tell you what the crown knows.'],
    ['THE KING', 'For the night itself \u2014 Pearl was there. Nine years old, small enough to be forgotten in a room full of grown-ups. She remembers everything. Hear it the way she tells it.']]);
  mode = 'script';
  await fadeTo(1, 1100);
  // the movie: the feast hall, a hundred years gone
  const king = makeEnt(THRONE_SPR, 14, 5, {});
  const kingSide = makeEnt(tile(g => {}), 15, 5, { noShadow: true });
  const silka = makeEnt(SPR.silka, 17, 5, {});
  const witness = makeEnt(SPR.pearlY, 24, 18, {});
  const crow1 = makeEnt(SPR.crowA, 5, 1, {}), crow2 = makeEnt(SPR.crowA, 17, 1, {}), crow3 = makeEnt(SPR.crowA, 27, 1, {});
  const wiz = makeEnt(wizSpr, 16, 20, { aura: true }); wiz.hidden = true;
  loadScene({ set: 'hall', rows: HALL, player: null,
    entities: [king, kingSide, silka, witness, crow1, crow2, crow3, wiz], triggers: {}, refs: {} });
  scene.focus = king;
  scene.dim = .38;
  await fadeTo(0, 900);
  await say([['PEARL\u2019S VOICE', 'First came the crows. Every crow in the valley, settling on the roof-beams at once, the way they do before a storm that has a name.'],
    ['PEARL\u2019S VOICE', 'Then the doors opened \u2014 though no hand touched them \u2014 and the cold came in wearing a man\u2019s shape.']]);
  mode = 'script';
  await flashViolet();
  wiz.hidden = false; scene.focus = wiz;
  await say([['THE STORM WIZARD', 'Harvest King. The valley has kept what is owed for a hundred years. I am come to collect the brightest thing in it.'],
    ['THE HARVEST KING', 'Name your price and take it from my stores. The valley pays its debts.'],
    ['THE STORM WIZARD', 'My price is standing beside you, wearing poppies in her hair.']]);
  mode = 'script';
  scene.focus = silka;
  await moveEntTo(silka, 16, 9); silka.dir = 'down';
  await say([['SILKA', 'Then hear the valley\u2019s answer, collector. I am not a debt. I am not a price. And I will not go.'],
    ['PEARL\u2019S VOICE', 'She refused him standing straight as a stalk in the field. I have loved her for a hundred years for that one moment.']]);
  mode = 'script';
  await flashViolet();
  wiz.hidden = true; silka.hidden = true;
  await say([['PEARL\u2019S VOICE', 'There was no thunder. That is the part nobody believes. There was a light, and a quiet \u2014 and where Silka had stood, there was nobody.'],
    ['PEARL\u2019S VOICE', 'The sleep took her on the road north, they say, before she had walked a mile. She sleeps still. That is the mercy in it, if there is one.']]);
  mode = 'script';
  scene.dim = .55;
  await say([['PEARL\u2019S VOICE', 'The King did not weep where we could see it. He walked out into the dawn and sealed the Great Barn with his own hands and his own strength \u2014 all of it. What was hunting the valley could not pass that seal.']]);
  mode = 'script';
  await fadeTo(1, 1200);
  // the movie: the village at dawn
  loadScene(buildVillage());
  player.hidden = true;
  scene.dim = .42;
  scene.focus = scene.entities[0];
  const oldKing = makeEnt(SPR.king, 15, 8, {}); oldKing.dir = 'up';
  const youngPearl = makeEnt(SPR.pearlY, 13, 9, {}); youngPearl.dir = 'up';
  scene.entities.push(oldKing, youngPearl);
  await fadeTo(0, 900);
  await say([['PEARL\u2019S VOICE', 'At dawn he came down to the village himself, and stood a long while looking at the fields he had saved, and the price of them.'],
    ['PEARL\u2019S VOICE', 'By harvest\u2019s end he was in the ground, and the village raised this stone where he had stood. I leave the flowers. I have always left the flowers.']]);
  mode = 'script';
  await fadeTo(1, 1200);
  // back in the throne room, a hundred years later
  loadScene(buildCastle());
  player.x = 24; player.y = 6; player.px = 24 * TILE; player.py = 6 * TILE; player.dir = 'up';
  await fadeTo(0, 900);
  playM(MUS.chime);
  await say([['THE KING', 'She sleeps in the black castle, in the northern mountain. The towers on the pass have never let a living soul through, and the great gate has never opened.'],
    ['THE KING', 'But the mountain is old, and there is a way that goes under it. Pearl knows where the old cave opens \u2014 she has kept more than the story, hero.'],
    ['THE KING', 'Go back to her. Then go north \u2014 and bring Silka home. A hundred years late, and not one day too late.']]);
  objective('Return to Pearl \u2014 her cottage is northwest in the village, under the cliff');
  mode = 'play';
}

async function endPart(){
  mode = 'script'; objective('');
  await fadeTo(1, 700);
  playM(MUS.jingle);
  await card({ art: true, title: 'PART ONE', sub: 'THE LEGEND OF SILKA — PART ONE COMPLETE',
    lines: ['The story is told. The valley is waiting.', 'Part Two: the road under the mountain.'] });
  location.reload();
}

// ============ acts / boot ============
async function act1(){
  G.stage = 0; G.cup = false;
  loadScene(buildHall());
  await fadeTo(0, 800);
  await say([['', 'The King\u2019s castle, the night of the harvest feast — a hundred years gone.'],
    ['', 'You are Pearl, nine years old, small enough to be forgotten in a room full of grown-ups. Remember everything.']]);
  objective('Speak with Princess Silka');
  mode = 'play';
}
async function act2(){
  mode = 'script';
  loadScene(buildVillage());
  await fadeTo(0, 800);
  await moveEntTo(player, 15, 18);
  await say([['', 'Castle-Foot Village, a hundred harvests after the last feast. The fields are gold. The statue\u2019s flowers are fresh.'],
    ['', 'You have come to ask what happened here. Begin where the valley begins: with its King.']]);
  objective('Find the King \u2014 his road climbs from the north overlook');
  mode = 'play';
}
async function act3(){
  loadScene(buildCottage());
  await fadeTo(0, 700);
  mode = 'play';
  objective('Speak with old Pearl');
}
(async function boot(){
  const H = location.hash; // scene-preview hooks (used for screenshot checks)
  if (H === '#hall' || H === '#village' || H === '#cottage' || H === '#castle' || H === '#dungeon' || H === '#castle2' || H === '#castle3'){
    $('card').style.display = 'none';
    loadScene(H === '#hall' ? buildHall() : H === '#village' ? buildVillage() : H === '#castle' ? buildCastle() : H === '#dungeon' ? buildDungeon() : H === '#castle2' ? buildCastle2F() : H === '#castle3' ? buildCastle3F() : buildCottage());
    if (H === '#village') scene.entities.push(makeEnt(wizSpr, 24, 16, { aura: true }));
    $('fade').style.opacity = 0; mode = 'play'; return;
  }
  const c = $('card');
  c.className = 'layer art';
  c.style.backgroundImage = 'none';
  const GEMS = [[50.3, 5.3, 6], [50.3, 31.7, 9.5], [40.6, 31.7, 4.5], [59.4, 31.7, 4.5],
                [50.2, 45.2, 6], [30.6, 89.6, 4], [69.4, 89.6, 4]];
  const STARS = [[6, 6], [12, 3.5], [88, 5], [94, 9], [80, 2.5], [20, 9], [3, 14], [97, 16]];
  c.innerHTML = '<div class="bgimg"></div>' +
    GEMS.map((g, i) => '<div class="gem" style="left:' + g[0] + '%;top:' + g[1] + '%;width:' + g[2] +
      '%;aspect-ratio:1;animation-delay:' + (i * 0.37).toFixed(2) + 's"></div>').join('') +
    '<div class="pushglow"></div>' +
    STARS.map((s, i) => '<div class="star" style="left:' + s[0] + '%;top:' + s[1] +
      '%;animation-delay:' + (i * 0.53).toFixed(2) + 's"></div>').join('');
  c.style.display = 'flex';
  const bgEl = c.querySelector('.bgimg');
  const FR = ['../art/title-frames/f0.jpg', '../art/title-frames/f1.jpg',
              '../art/title-frames/f2.jpg', '../art/title-frames/f3.jpg'];
  if (typeof Image !== 'undefined') FR.forEach(u => { const im = new Image(); im.src = u; });
  let fi = 0;
  bgEl.style.backgroundImage = 'url(' + FR[0] + ')';
  const cycle = setInterval(() => { fi = (fi + 1) % 4; bgEl.style.backgroundImage = 'url(' + FR[fi] + ')'; }, 190);
  let woke = false;
  const tapA = () => { aPressed = true; };
  const wake = () => { if (!woke){ woke = true; playM(MUS.theme); } };
  addEventListener('pointerdown', wake); addEventListener('keydown', wake);
  addEventListener('pointerdown', tapA);
  await new Promise(r => { const iv = setInterval(() => { if (woke){ clearInterval(iv); r(); } }, 60); });
  takeA(); // flush the waking tap — the NEXT tap / A press is PUSH START
  await new Promise(r => { const iv = setInterval(() => { if (takeA()){ clearInterval(iv); r(); } }, 60); });
  removeEventListener('pointerdown', wake); removeEventListener('keydown', wake);
  removeEventListener('pointerdown', tapA);
  clearInterval(cycle);
  c.style.display = 'none';
  stopM(MUS.theme); playM(MUS.fanfare);
  await fadeTo(1, 400); await act2();
})();
</script>
