<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legend of Corn — Pixel Matrix & Palette Renderer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    background: #0B0A10; color: #F5EFE6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    display: flex; flex-direction: column; gap: 12px;
  }
  h1 {
    margin: 0; font-size: 16px; color: #FFD21E;
    letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center;
  }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    background: #14121E; border: 2px solid #2D283E; border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  label { font-size: 12px; color: #B8B0C8; font-weight: bold; }
  textarea {
    width: 100%; height: 260px;
    background: #0D0C14; color: #E8E2F5;
    border: 1px solid #3D3654; border-radius: 6px;
    padding: 10px; font-family: inherit; font-size: 12px; line-height: 1.4;
    resize: vertical;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select {
    background: #242036; color: #FFFDF7;
    border: 1px solid #524970; border-radius: 6px;
    padding: 7px 12px; font-family: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #342E4D; }
  button.primary { background: #2E8540; border-color: #63C756; font-weight: bold; }
  button.gold { background: #8A5A08; border-color: #FFD21E; color: #FFF68F; font-weight: bold; }
  .stage-wrap {
    flex: 1; min-height: 300px;
    border: 2px dashed #38314D; border-radius: 8px;
    display: flex; align-items: flex-start; justify-content: center;
    overflow: auto; padding: 16px; position: relative;
  }
  .bg-dark { background: #14121C; }
  .bg-grass { background: #3E8E41; }
  .bg-checker {
    background-color: #222;
    background-image: linear-gradient(45deg, #2e2e2e 25%, transparent 25%),
      linear-gradient(-45deg, #2e2e2e 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2e2e2e 75%),
      linear-gradient(-45deg, transparent 75%, #2e2e2e 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 8px 24px rgba(0,0,0,0.65); }
  .meta { font-size: 12px; color: #9E96B0; }
  .err { color: #FF6B8B; font-size: 12px; min-height: 16px; }
  .warn { color: #FFD21E; font-size: 12px; min-height: 16px; }
  .ok { color: #63C756; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>

<h1>
  <span>&#9876; LEGEND OF CORN — PIXEL MATRIX RENDERER</span>
  <span class="meta" id="dim-badge">0 × 0 px</span>
</h1>

<div class="panel" id="png-panel">
  <label>&#128444; PNG &#8594; CODE — pick an image file and turn it into palette + matrix code:</label>
  <div class="controls">
    <input type="file" id="png-file" accept="image/*" style="color:#B8B0C8;">
    <label>Name:</label>
    <input type="text" id="png-name" value="PNG_SPRITE" style="background:#0D0C14;color:#E8E2F5;border:1px solid #3D3654;border-radius:6px;padding:7px 10px;font-family:inherit;font-size:12px;width:130px;">
    <label>Max colors:</label>
    <select id="png-colors">
      <option value="8">8</option>
      <option value="12">12</option>
      <option value="16" selected>16</option>
      <option value="24">24</option>
      <option value="32">32</option>
      <option value="48">48</option>
    </select>
    <label>Shrink to width:</label>
    <select id="png-width">
      <option value="0" selected>Original</option>
      <option value="384">384 px</option>
      <option value="256">256 px</option>
      <option value="192">192 px</option>
      <option value="128">128 px</option>
      <option value="96">96 px</option>
      <option value="64">64 px</option>
      <option value="48">48 px</option>
      <option value="32">32 px</option>
    </select>
    <button class="primary" onclick="convertPng()">&#9654; Convert PNG</button>
    <label style="display:flex;align-items:center;gap:5px;"><input type="checkbox" id="png-condense" checked> Condense upscaled art (auto)</label>
  </div>
  <textarea id="png-out" spellcheck="false" placeholder="Converted code appears here..." style="height:150px;"></textarea>
  <div class="controls">
    <button class="gold" onclick="copyPngCode()">&#128203; Copy Code</button>
    <button onclick="downloadPngMd()">&#11015; Download .md file</button>
    <button onclick="sendPngToRenderer()">&#11015; Send to Renderer Below</button>
    <span class="meta" id="png-meta"></span>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <label>1. Paste palette + sprite code (any of our formats — JS or JSON, quoted or not):</label>
    <textarea id="code-input" spellcheck="false" oninput="debouncedRender()">// Our real Storm Wizard (the v5 standard) — paste any sprite block over it and it renders as you type.
const PAL = {"K": "#09080F", "R": "#FF2A3C", "W": "#FFFFFF", "E": "#E9D5FF", "V": "#9333EA", "v": "#581C87", "d": "#181E2C", "S": "#2B354A", "L": "#4E5E80", "B": "#5C3D24"};
const A = ["............KK..........", "...........KLLK.........", "..W.K.E...KLLdLK........", ".EV.B.VE.KLLdddLK.......", "WEVKBKVEWKLdddddLK......", ".VKVVVKV.KLLdddLLK......", "...KBK..KLdKKKKKdLK.....", "...KBK.KLLKKKKKKKLLK....", "...KBK.KLdKKKKKKKdLK....", "...KBK.KLSKRRKKRRKLK....", "...KBK.KLdKKKKKKKdLK....", ".KKKBKKKKLddVEKddLKKKK..", "KLLSSSLLLddSVEdddSLLSLLK", "KLSdKLLddddddVESSLLKdK..", "KLd.KdSddddEVdSSSdK.dK..", "KK..KdddddEVSddSSSK..K..", "....KdddddSSVEddddK.....", "...B.KddddSSSVEdddK.....", "...B.KdSdddEVdddddK.....", "...B.KddddEVdSddddK.....", "...B.KddddSSVEddddK.....", "...B.KddddSSdVEdddK.....", "...B.KdSdddEVdSSddK.....", "...B.KdddddddVEdddK.....", "...B.KddddSEVdddddK.....", "...B.KddddEVddddddK.....", "...B.KdSdddSVEddddK.....", "...B.KddddddVEdddK......", "...B.KdKddddKVEdKdKd....", "...B.Kd.KdKEVKddKKdK....", "...B.K..KdK...KdK.dK....", "...K....KK.....dK..K...."];
const B = ["............KK..........", "...........KLLK.........", "..E.K.W...KLLdLK........", ".VE.B.EV.KLLdddLK.......", "EVWKBKWVEKLdddddLK......", ".EKVVVKE.KLLdddLLK......", "...KBK..KLdKKKKKdLK.....", "...KBK.KLLKKKKKKKLLK....", "...KBK.KLdKKKKKKKdLK....", "...KBK.KLSKRRKKRRKLK....", "...KBK.KLdKKKKKKKdLK....", ".KKKBKKKKLddKVEddLKKKK..", "KLLSSSLLLddSdVEddSLLSLLK", "KLSdKLLddSSEVddddSSLLKdK", "KLd.KdSdSSdddVEddSSdK.dK", "KK..KdSSSSddddVEdSK..K..", "....KdSSSSddEVddddK.....", "...B.KdSSSdEVSddddK.....", "...B.KddddSddVEdddK.....", "...B.KdSddddddVEddK.....", "...B.KddddddEVddddK.....", "...B.KddddSEVdddddK.....", "...B.KddddSSdVEdddK.....", "...B.KdSdddEVdddddK.....", "...B.KdddddddVEdddK.....", "...B.KddddSSddVEddK.....", "...B.KddddSSEVddddK.....", "...B.KdSdddddVEdddK.....", "...B.KdKdddEVdddKdKd....", "...B.Kd.KdKd.VEdKKdK....", "...B.K..KdK...KdK.dK....", "...K....KK.....dK..K...."];</textarea>
    <div class="controls">
      <button class="primary" onclick="renderCode()">&#9654; Render Sprite</button>
      <button onclick="downloadInputMd()">&#11015; Save code as .md</button>
      <button onclick="condenseSprite()">&#128230; Condense sprite</button>
      <button onclick="document.getElementById('code-input').value=''">Clear</button>
      <select id="sprite-picker" onchange="renderSelected()" style="display:none;"></select>
      <select id="palette-picker" onchange="renderSelected()" style="display:none;"></select>
    </div>
    <div class="ok" id="ok-box"></div>
    <div class="warn" id="warn-box"></div>
    <div class="err" id="err-box"></div>
  </div>

  <div class="panel">
    <div class="controls">
      <label>Zoom:</label>
      <select id="zoom-sel" onchange="renderSelected()">
        <option value="fit">Fit whole picture</option>
        <option value="0.25">&#188;&#215;</option>
        <option value="0.5">&#189;&#215;</option>
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
        <option value="6">6×</option>
        <option value="8">8×</option>
        <option value="12" selected>12×</option>
        <option value="16">16×</option>
      </select>
      <label>Backdrop:</label>
      <select id="bg-sel" onchange="updateBg()">
        <option value="bg-dark" selected>Dark Slate</option>
        <option value="bg-grass">Zelda Grass</option>
        <option value="bg-checker">Transparent Checker</option>
      </select>
      <button onclick="toggleGrid()" id="grid-btn">Grid: OFF</button>
      <button onclick="toggleSheet()" id="sheet-btn">Sheet: OFF</button>
      <button class="gold" onclick="downloadPng()">&#11015; Download PNG</button>
    </div>
    <div class="stage-wrap bg-dark" id="stage">
      <canvas id="preview-canvas"></canvas>
    </div>
  </div>
</div>

<script>
// ==== PARSER (pure — handles every format our pipeline produces) ====
// - palettes as JS objects with quoted OR unquoted keys: {"K": "#fff"} / {K: '#fff'}
// - several named palettes in one paste (PAL, STATUE_PAL, WIZ_PAL...) — all kept, picker chooses
// - palettes nested in JSON dumps: "palette": {...}
// - sprite arrays as NAME = [...], NAME: [...], or "rows": [...] in JSON
function parseCode(src) {
  const palettes = {};   // name -> {char: hex}
  const sprites = {};    // name -> [rows]

  // 1) named palette objects: NAME = { ... } whose body is char:hex entries
  const objRe = /(?:const|let|var)?\s*"?([A-Za-z0-9_]+)"?\s*[:=]\s*\{([^{}]*)\}/g;
  for (const m of src.matchAll(objRe)) {
    const entries = {};
    for (const e of m[2].matchAll(/['"]?([A-Za-z0-9_])['"]?\s*:\s*['"](#[0-9A-Fa-f]{3,8})['"]/g)) entries[e[1]] = e[2];
    if (Object.keys(entries).length >= 2) palettes[m[1]] = entries;
  }
  // 2) JSON-nested palettes: "palette": { ... }
  let pn = 0;
  for (const m of src.matchAll(/"palette"\s*:\s*\{([^{}]*)\}/g)) {
    const entries = {};
    for (const e of m[1].matchAll(/['"]?([A-Za-z0-9_])['"]?\s*:\s*['"](#[0-9A-Fa-f]{3,8})['"]/g)) entries[e[1]] = e[2];
    if (Object.keys(entries).length >= 2) palettes['palette_' + (++pn)] = entries;
  }
  // 3) sprite arrays: NAME = [...] or NAME: [...]
  const arrRe = /(?:const|let|var)?\s*"?([A-Za-z0-9_]+)"?\s*[:=]\s*\[\s*((?:['"][^'"]*['"]\s*,?\s*)+)\]/g;
  for (const m of src.matchAll(arrRe)) {
    const rows = [...m[2].matchAll(/['"]([^'"]+)['"]/g)].map(r => r[1]);
    if (rows.length > 0 && rows.every(r => r.length >= 2)) sprites[m[1]] = rows;
  }
  // 4) JSON "rows": [...] arrays, named by their parent key when visible
  for (const m of src.matchAll(/"rows"\s*:\s*\[\s*((?:['"][^'"]*['"]\s*,?\s*)+)\]/g)) {
    const rows = [...m[1].matchAll(/['"]([^'"]+)['"]/g)].map(r => r[1]);
    if (rows.length === 0) continue;
    const before = src.slice(Math.max(0, m.index - 60), m.index);
    const parent = [...before.matchAll(/"(\w+)"\s*:\s*\{/g)].pop();
    sprites[parent ? parent[1] + '_rows' : 'rows_' + Object.keys(sprites).length] = rows;
  }
  // 5) fallback: raw quoted lines with no name at all
  if (Object.keys(sprites).length === 0) {
    const rawRows = [...src.matchAll(/['"]([ .#A-Za-z0-9_]{2,})['"]/g)].map(r => r[1]).filter(r => /[.#]/.test(r));
    if (rawRows.length > 0) sprites['SPRITE_1'] = rawRows;
  }
  return { palettes, sprites };
}
// ==== END PARSER ====

  let parsedSprites = {};
  let parsedPalettes = {};
  let activePalette = {};
  let showGrid = false;
  let sheetMode = false;

  const DEFAULT_PALETTE = {
    K: '#141218', W: '#FFFFFF', R: '#D9383A', G: '#3E8E41',
    B: '#6E4226', Y: '#FFD21E', V: '#8B5CF6', E: '#E9D5FF',
    S: '#8C857B', L: '#C4BDB2', D: '#4A433D', O: '#FF6A1A',
    C: '#3D8FD1', P: '#E86B8A', M: '#6EB54C', T: '#D9A066'
  };

  function pickPalette(name) {
    // merge: defaults under the chosen palette, so a partial palette still renders
    activePalette = { ...DEFAULT_PALETTE, ...(parsedPalettes[name] || {}) };
    return name;
  }

  let renderTimer = null;
  function debouncedRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderCode, 250);
  }

  function renderCode() {
    const errBox = document.getElementById('err-box');
    const okBox = document.getElementById('ok-box');
    const warnBox = document.getElementById('warn-box');
    errBox.textContent = ''; okBox.textContent = ''; warnBox.textContent = '';
    const src = document.getElementById('code-input').value;
    try {
      const { palettes, sprites } = parseCode(src);
      parsedPalettes = palettes;
      parsedSprites = sprites;
      const names = Object.keys(sprites);
      if (names.length === 0) throw new Error('No sprite row arrays found. Paste a palette + array block.');
      const picker = document.getElementById('sprite-picker');
      picker.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
      picker.style.display = names.length > 1 ? 'inline-block' : 'none';
      const palNames = Object.keys(palettes);
      const palPicker = document.getElementById('palette-picker');
      palPicker.innerHTML = palNames.map(n => `<option value="${n}">Palette: ${n}</option>`).join('');
      palPicker.style.display = palNames.length > 1 ? 'inline-block' : 'none';
      if (palNames.length > 0) pickPalette(palPicker.value || palNames[0]);
      else activePalette = { ...DEFAULT_PALETTE };
      okBox.textContent = `Found ${names.length} sprite(s)` + (palNames.length ? `, ${palNames.length} palette(s): ${palNames.join(', ')}` : ' — no palette found, using built-in defaults');
      renderSelected();
    } catch (e) {
      errBox.textContent = e.message;
    }
  }

  function drawSprite(ctx, rows, ox, oy, zoom) {
    const missing = new Set();
    for (let y = 0; y < rows.length; y++) {
      const row = rows[y];
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === '.' || ch === ' ') continue;
        const hex = activePalette[ch];
        if (!hex) missing.add(ch);
        ctx.fillStyle = hex || '#FF00FF';
        ctx.fillRect(ox + x * zoom, oy + y * zoom, zoom, zoom);
      }
    }
    return missing;
  }

  function drawGrid(ctx, w, h, zoom, ox, oy) {
    if (!showGrid || zoom < 4) return;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(ox + x * zoom + 0.5, oy); ctx.lineTo(ox + x * zoom + 0.5, oy + h * zoom); ctx.stroke(); }
    for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(ox, oy + y * zoom + 0.5); ctx.lineTo(ox + w * zoom, oy + y * zoom + 0.5); ctx.stroke(); }
  }

  // Draw a sprite once at native 1x onto its own canvas; the stage then scales
  // that canvas up or down, so zoom can go BELOW 1x — a whole village picture
  // (hundreds of pixels wide) can be seen entire instead of only in slices.
  function spriteCanvas(rows) {
    const cv = document.createElement('canvas');
    cv.width = Math.max(...rows.map(r => r.length));
    cv.height = rows.length;
    const cx = cv.getContext('2d');
    const missing = drawSprite(cx, rows, 0, 0, 1);
    return { cv, missing };
  }

  function effectiveZoom(w, h) {
    const v = document.getElementById('zoom-sel').value;
    let z;
    if (v !== 'fit') z = parseFloat(v);
    else {
      const stage = document.getElementById('stage');
      const availW = Math.max(60, stage.clientWidth - 34);
      const availH = Math.max(200, Math.round(window.innerHeight * 0.72));
      z = Math.min(availW / w, availH / h, 6);
    }
    // A browser tab dies (the frowny face) when a canvas gets too big, so cap
    // the display size no matter what zoom was picked: a huge picture simply
    // shows at the biggest safe zoom instead of crashing the page.
    z = Math.min(z, 4096 / w, 4096 / h);
    if (w * z * (h * z) > 16000000) z = Math.sqrt(16000000 / (w * h));
    return Math.max(0.05, z);
  }

  function renderSelected() {
    const warnBox = document.getElementById('warn-box');
    warnBox.textContent = '';
    const names = Object.keys(parsedSprites);
    if (names.length === 0) return;
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const missingAll = new Set();

    if (sheetMode) {
      // every sprite on one sheet, labeled — for reviewing a whole cast drop at once
      const rawZ = document.getElementById('zoom-sel').value;
      let zoom = rawZ === 'fit' ? 1 : parseFloat(rawZ);
      const maxSW = Math.max(...names.map(n => Math.max(...parsedSprites[n].map(r => r.length))));
      const maxSH = Math.max(...names.map(n => parsedSprites[n].length));
      zoom = Math.min(zoom, 2048 / maxSW, 2048 / maxSH); // same crash cap, per sheet cell
      const cellW = Math.max(...names.map(n => Math.max(...parsedSprites[n].map(r => r.length)))) * zoom;
      const cellH = Math.max(...names.map(n => parsedSprites[n].length)) * zoom + 18;
      const cols = Math.min(4, names.length);
      const rowsN = Math.ceil(names.length / cols);
      canvas.width = Math.ceil(cols * cellW + (cols + 1) * 8);
      canvas.height = Math.ceil(rowsN * cellH + (rowsN + 1) * 8);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;
      ctx.font = '11px monospace'; ctx.fillStyle = '#B8B0C8';
      names.forEach((n, i) => {
        const rows = parsedSprites[n];
        const { cv, missing } = spriteCanvas(rows);
        missing.forEach(c => missingAll.add(c));
        const ox = 8 + (i % cols) * (cellW + 8), oy = 8 + Math.floor(i / cols) * (cellH + 8);
        ctx.drawImage(cv, ox, oy, Math.round(cv.width * zoom), Math.round(cv.height * zoom));
        drawGrid(ctx, cv.width, cv.height, zoom, ox, oy);
        ctx.fillStyle = '#B8B0C8';
        ctx.fillText(n, ox, oy + Math.round(rows.length * zoom) + 13);
      });
      document.getElementById('dim-badge').textContent = `${names.length} sprites`;
    } else {
      const picker = document.getElementById('sprite-picker');
      const name = picker.value || names[0];
      const rows = parsedSprites[name];
      if (!rows) return;
      const h = rows.length;
      const w = Math.max(...rows.map(r => r.length));
      const { cv, missing } = spriteCanvas(rows);
      missing.forEach(c => missingAll.add(c));
      const zoom = effectiveZoom(w, h);
      document.getElementById('dim-badge').textContent = `${w} × ${h} px · ${Math.round(zoom * 100) / 100}×`;
      canvas.width = Math.max(1, Math.round(w * zoom));
      canvas.height = Math.max(1, Math.round(h * zoom));
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(cv, 0, 0, canvas.width, canvas.height);
      drawGrid(ctx, w, h, zoom, 0, 0);
    }
    if (missingAll.size > 0) {
      warnBox.textContent = 'Shown in bright pink — these letters have no color in the chosen palette: ' + [...missingAll].join(', ') + '. Pick another palette above, or add them to the pasted palette.';
    }
  }

  window.addEventListener('resize', () => {
    if (document.getElementById('zoom-sel').value === 'fit') renderSelected();
  });

  function toggleGrid() {
    showGrid = !showGrid;
    document.getElementById('grid-btn').textContent = `Grid: ${showGrid ? 'ON' : 'OFF'}`;
    renderSelected();
  }

  function toggleSheet() {
    sheetMode = !sheetMode;
    document.getElementById('sheet-btn').textContent = `Sheet: ${sheetMode ? 'ON' : 'OFF'}`;
    renderSelected();
  }

  function updateBg() {
    const stage = document.getElementById('stage');
    stage.className = 'stage-wrap ' + document.getElementById('bg-sel').value;
  }

  function downloadPng() {
    const picker = document.getElementById('sprite-picker');
    if (!sheetMode) {
      const names = Object.keys(parsedSprites);
      const name = picker.value || names[0];
      const rows = parsedSprites[name];
      if (rows) {
        // Export at the chosen zoom when zoomed in, but never below native 1x —
        // a Fit / zoomed-out view still downloads the full-resolution picture.
        const v = document.getElementById('zoom-sel').value;
        let ez = v === 'fit' ? 2 : Math.max(1, parseFloat(v));
        const { cv } = spriteCanvas(rows);
        ez = Math.min(ez, 8192 / cv.width, 8192 / cv.height); // export canvas cap — same crash guard
        if (cv.width * ez * (cv.height * ez) > 64000000) ez = Math.sqrt(64000000 / (cv.width * cv.height));
        const out = document.createElement('canvas');
        out.width = Math.round(cv.width * ez);
        out.height = Math.round(cv.height * ez);
        const ox = out.getContext('2d');
        ox.imageSmoothingEnabled = false;
        ox.drawImage(cv, 0, 0, out.width, out.height);
        const link = document.createElement('a');
        link.download = `${(name || 'sprite').toLowerCase()}.png`;
        link.href = out.toDataURL('image/png');
        link.click();
        return;
      }
    }
    const canvas = document.getElementById('preview-canvas');
    const link = document.createElement('a');
    link.download = 'sheet.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

// ==== CONDENSE (pure) ====
// Upscaled pixel art is a small drawing wearing big square blocks: every
// "pixel" is really a b x b block of one color. Find the largest such block
// grid and take one pixel per block — the picture renders IDENTICAL and the
// code shrinks by b x b. A true-size detailed picture has no block grid:
// this returns null for it (verified by an exact roundtrip diff, never guessed).
function condenseRows(rows) {
  const H = rows.length;
  const W = Math.max(...rows.map(r => r.length));
  const total = W * H;
  let best = 0;
  for (let b = 2; b <= 48; b++) {
    if (b >= W || b >= H) break;
    // cheap gate: in blocked art, color changes sit ON block boundaries.
    // Count changes anywhere else; too many and this b is not the grid.
    let interior = 0;
    const limit = total * 0.01;
    let stop = false;
    for (let y = 0; y < H && !stop; y++) {
      const row = rows[y];
      for (let x = 1; x < row.length; x++) {
        if (row[x] !== row[x - 1] && x % b !== 0) { interior++; if (interior > limit) { stop = true; break; } }
      }
      if (!stop && y > 0 && y % b !== 0) {
        const up = rows[y - 1];
        for (let x = 0; x < row.length; x++) {
          if (row[x] !== up[x]) { interior++; if (interior > limit) { stop = true; break; } }
        }
      }
    }
    if (!stop) best = b;
  }
  if (!best) return null;
  const b = best;
  const small = [];
  for (let by = 0; by < H; by += b) {
    let row = '';
    for (let bx = 0; bx < W; bx += b) {
      const counts = {};
      for (let y = by; y < Math.min(by + b, H); y++)
        for (let x = bx; x < Math.min(bx + b, W); x++) {
          const ch = rows[y][x];
          counts[ch] = (counts[ch] || 0) + 1;
        }
      let top = '.', tn = -1;
      for (const ch in counts) if (counts[ch] > tn) { tn = counts[ch]; top = ch; }
      row += top;
    }
    small.push(row);
  }
  // exact verification: blow the small one back up and count differing pixels
  let diff = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (small[Math.floor(y / b)][Math.floor(x / b)] !== rows[y][x]) diff++;
  if (diff / total > 0.005) return null;
  return { rows: small, block: b, diffFrac: diff / total };
}

function emitCode(name, palette, rows) {
  return 'const ' + name + '_PALETTE = ' + JSON.stringify(palette, null, 1) + ';\n\nconst ' + name + ' = [\n' +
    rows.map(r => '  ' + JSON.stringify(r)).join(',\n') + '\n];\n';
}
// ==== END CONDENSE ====

// ==== PNG -> CODE (pure core; browser glue below) ====
function pngToCode(data, w, h, maxColors, name) {
  const counts = new Map();
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 128) continue;
    const key = (data[i] << 16) | (data[i + 1] << 8) | data[i + 2];
    const e = counts.get(key);
    if (e) e.n++; else counts.set(key, { n: 1, r: data[i], g: data[i + 1], b: data[i + 2] });
  }
  let colors = [...counts.values()].sort((a, b) => b.n - a.n);
  if (colors.length > maxColors) {
    const buckets = new Map();
    for (const c of colors) {
      const bk = ((c.r >> 4) << 8) | ((c.g >> 4) << 4) | (c.b >> 4);
      const b = buckets.get(bk);
      if (b) { b.n += c.n; b.r += c.r * c.n; b.g += c.g * c.n; b.b += c.b * c.n; }
      else buckets.set(bk, { n: c.n, r: c.r * c.n, g: c.g * c.n, b: c.b * c.n });
    }
    colors = [...buckets.values()].sort((a, b) => b.n - a.n).slice(0, maxColors)
      .map(b => ({ n: b.n, r: Math.round(b.r / b.n), g: Math.round(b.g / b.n), b: Math.round(b.b / b.n) }));
  }
  const CH = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const palette = {};
  colors.forEach((c, i) => { palette[CH[i]] = '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join(''); });
  const nearest = (r, g, b) => {
    let best = 0, bd = Infinity;
    for (let i = 0; i < colors.length; i++) {
      const d = (colors[i].r - r) ** 2 + (colors[i].g - g) ** 2 + (colors[i].b - b) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    return CH[best];
  };
  const rows = [];
  for (let y = 0; y < h; y++) {
    let row = '';
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      row += data[i + 3] < 128 ? '.' : nearest(data[i], data[i + 1], data[i + 2]);
    }
    rows.push(row);
  }
  const code = 'const ' + name + '_PALETTE = ' + JSON.stringify(palette, null, 1) + ';\n\nconst ' + name + ' = [\n' +
    rows.map(r => '  ' + JSON.stringify(r)).join(',\n') + '\n];\n';
  return { code, palette, rows, colorCount: colors.length };
}

function convertPng() {
  const file = document.getElementById('png-file').files[0];
  const meta = document.getElementById('png-meta');
  if (!file) { meta.textContent = 'Pick an image file first.'; return; }
  const name = (document.getElementById('png-name').value || 'PNG_SPRITE').toUpperCase().replace(/[^A-Z0-9_]/g, '_');
  const maxColors = parseInt(document.getElementById('png-colors').value, 10);
  const maxW = parseInt(document.getElementById('png-width').value, 10);
  const img = new Image();
  img.onload = () => {
    let w = img.width, h = img.height;
    if (maxW > 0 && w > maxW) { h = Math.max(1, Math.round(h * maxW / w)); w = maxW; }
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false;
    cx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);
    const data = cx.getImageData(0, 0, w, h).data;
    let out = pngToCode(data, w, h, maxColors, name);
    let note = '';
    if (document.getElementById('png-condense').checked) {
      const res = condenseRows(out.rows);
      if (res) {
        const used = new Set(res.rows.join(''));
        const pal = {};
        for (const k of Object.keys(out.palette)) if (used.has(k)) pal[k] = out.palette[k];
        note = ' · CONDENSED ' + w + '×' + h + ' → ' + res.rows[0].length + '×' + res.rows.length +
          ' (' + res.block + '× blocks — same picture, ' + Math.round(res.block * res.block) + '× less code)';
        out = { code: emitCode(name, pal, res.rows), palette: pal, rows: res.rows, colorCount: Object.keys(pal).length };
        w = res.rows[0].length; h = res.rows.length;
      } else {
        note = ' · no block grid found — this picture is true-size (shrink the width to make its code smaller)';
      }
    }
    lastPng = { name, w, h, colorCount: out.colorCount, code: out.code };
    document.getElementById('png-out').value = out.code;
    meta.textContent = w + ' × ' + h + ' px → ' + out.colorCount + ' colors, ' + out.code.length + ' characters of code' + note;
  };
  img.src = URL.createObjectURL(file);
}

function copyPngCode() {
  const t = document.getElementById('png-out');
  if (!t.value) return;
  t.select();
  if (navigator.clipboard) navigator.clipboard.writeText(t.value);
  else document.execCommand('copy');
}

function sendPngToRenderer() {
  const code = document.getElementById('png-out').value;
  if (!code) return;
  document.getElementById('code-input').value = code;
  renderCode();
}

// ==== FILE HAND-OFF ====
// No more giant copy-pastes: the app saves a small .md file holding the code,
// Michael hands the file to Muse, and Muse reads it straight into the game.
let lastPng = null; // {name, w, h, colorCount, code} from the latest conversion

function saveTextFile(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.download = filename;
  link.href = URL.createObjectURL(blob);
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 4000);
}

function mdWrap(name, metaLine, code) {
  return '# ' + name + ' — pixel code file\n\n' + (metaLine ? metaLine + '\n\n' : '') +
    'Hand this file to Muse — it reads the code block below and translates it into the game.\n\n' +
    '```js\n' + code.replace(/\s+$/, '') + '\n```\n';
}

function downloadPngMd() {
  const code = document.getElementById('png-out').value;
  const meta = document.getElementById('png-meta');
  if (!code) { meta.textContent = 'Convert a PNG first, then download the file.'; return; }
  const name = (lastPng && lastPng.name) || 'PNG_SPRITE';
  const metaLine = lastPng ? ('Size: ' + lastPng.w + ' × ' + lastPng.h + ' px · Colors: ' + lastPng.colorCount) : '';
  saveTextFile(name.toLowerCase().replace(/_/g, '-') + '.md', mdWrap(name, metaLine, code));
  meta.textContent = 'Saved the .md file — give that file to Muse.';
}

function condenseSprite() {
  const names = Object.keys(parsedSprites);
  const errBox = document.getElementById('err-box');
  if (names.length === 0) { errBox.textContent = 'Render a sprite first, then condense it.'; return; }
  const picker = document.getElementById('sprite-picker');
  const name = picker.value || names[0];
  const rows = parsedSprites[name];
  const W = Math.max(...rows.map(r => r.length)), H = rows.length;
  const res = condenseRows(rows);
  if (!res) {
    errBox.textContent = 'No block grid in ' + name + ' — this picture is already true-size, every pixel is real detail. Condense cannot shrink it without changing it; shrinking the width at convert time is the lever for pictures like this.';
    return;
  }
  const used = [...new Set(res.rows.join(''))].filter(c => c !== '.' && c !== ' ');
  const pal = {};
  used.forEach(c => { if (activePalette[c]) pal[c] = activePalette[c]; });
  document.getElementById('code-input').value = emitCode(name, pal, res.rows);
  renderCode();
  document.getElementById('ok-box').textContent = 'Condensed ' + name + ': ' + W + '×' + H + ' → ' + res.rows[0].length + '×' + res.rows.length +
    ' using ' + res.block + '× blocks. Roundtrip check: ' + (res.diffFrac * 100).toFixed(3) + '% of pixels differ — the same picture at a fraction of the code.';
}

function downloadInputMd() {
  const code = document.getElementById('code-input').value;
  const errBox = document.getElementById('err-box');
  if (!code.trim()) { errBox.textContent = 'Nothing to save yet — paste code first.'; return; }
  const picker = document.getElementById('sprite-picker');
  const name = (picker && picker.value) || 'SPRITE';
  const n = Object.keys(parsedSprites).length;
  saveTextFile(name.toLowerCase().replace(/_/g, '-') + '.md', mdWrap(name, 'Sprites in this file: ' + (n || 1), code));
  document.getElementById('ok-box').textContent = 'Saved the .md file — give that file to Muse.';
}

  renderCode();
</script>
</body>
